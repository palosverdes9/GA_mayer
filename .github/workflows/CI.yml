name: CI Pipeline
on:
  workflow_dispatch: 
  pull_request:
    branches:
      - main

jobs:
  unit-tests:
    name: Running Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@latest
      - name: Setup Python
        uses: actions/setup-python@latest
        with: 
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Unit Tests
        run: |
          mkdir reports/  
          pytest test_app.py --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml:reports/coverage.xml --cov-report=term-missing -v
      - name: upload Code Coverage Report
        uses: actions/upload-artifact@latest
        with:
          name: unit-test-report
          path: reports/
  
