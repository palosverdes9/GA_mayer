name: CI Pipeline
on:
  workflow_dispatch: 
  pull_request:
    branches:
      - main

jobs:
  codeql: #CI 2.SAST
    name: CodeQL Security Scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write # Required to upload the analysis results
    strategy:
      matrix: 
        language: [ 'python']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5.0.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "security"
          
  sonarqube: #CI 3.code quality
    name: SonarQube
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v5.0.0
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Download Coverage Report
        uses: actions/download-artifact@v5.0.0
        with:
          name: unit-test-report
          path: reports/
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          
  unit-tests: #CI 6 testing
    name: Running Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@latest
      - name: Setup Python
        uses: actions/setup-python@latest
        with: 
          python-version: '3.10'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Unit Tests
        run: |
          mkdir reports/  
          pytest test_app.py --junitxml=reports/unit-test-results.xml --cov=. --cov-report=xml:reports/coverage.xml --cov-report=term-missing -v
      - name: upload Code Coverage Report
        uses: actions/upload-artifact@latest
        with:
          name: unit-test-report
          path: reports/

  build:
    name: Build Image
    runs-on: ubuntu-latest
    needs: [unit-tests, sonarqube, codeql]
    outputs:
      image-tags: ${{ steps.vars.outputs.IMAGE_TAGS }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5.0.0
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3.0.0
      - name: Generate Image tags
        id: vars
        run: |
          IMAGE_TAGS="${{ github.run_id }}-${GITHUB_SHA::7}"
          echo "IMAGE_TAGS=$IMAGE_TAGS" >> $GITHUB_OUTPUT
      - name: Build Image (no push)
        uses: docker/build-push-action@v5.0.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: thinknyx_app:${{ steps.vars.outputs.IMAGE_TAGS }}
          load: true # automatically load the image in the local runner and will remain available for next step
      - name: Save Docker Image
        run: docker save thinknyx_app:${{ steps.vars.outputs.IMAGE_TAGS }} -o thinknyx_app.tar
      - name: Upload Docker Image Artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: thinknyx_app_image
          path: thinknyx_app.tar

  publish-dockerhub:
    name: Publish to Docker Hub
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download the Image
        uses: actions/download-artifact@v5.0.0
        with:
          name: thinknyx_app_image
          path: .
      - name: Load Docker Image
        run: docker load -i thinknyx_app.tar
      - name: Docker Login
        uses: docker/login-action@v3 # docker login -u DOCKERHUB_USER -p DOCKERHUB_PASSWORD
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag Image
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image-tags }}"
          docker image tag thinknyx_app:$IMAGE_TAG ${{ secrets.DOCKERHUB_USERNAME }}/thinknyx_app:$IMAGE_TAG
      - name: Push Image
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image-tags }}"
          docker image push ${{ secrets.DOCKERHUB_USERNAME }}/thinknyx_app:$IMAGE_TAG

  publish-ghcr:
    name: Publish to GitHub Container Registry
    runs-on: ubuntu-latest
    needs: build
    permissions:
      packages: write
      contents: read
    steps:
      - name: Download the Image
        uses: actions/download-artifact@v5.0.0
        with:
          name: thinknyx_app_image
          path: .
      - name: Load Docker Image
        run: docker load -i thinknyx_app.tar
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # GitHub automatically creates a GITHUB_TOKEN secret to use in your workflow, push to GHCR, Create releaase, add comments, create issues
      - name: Tag Image
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image-tags }}"
          docker image tag thinknyx_app:$IMAGE_TAG ghcr.io/${{ github.repository_owner }}/thinknyx_app:$IMAGE_TAG
      - name: Push Image
        run: |
          IMAGE_TAG="${{ needs.build.outputs.image-tags }}"
          docker image push ghcr.io/${{ github.repository_owner }}/thinknyx_app:$IMAGE_TAG
